[workspace]
members = ["crates/core", "crates/audio", "crates/app", "crates/mcp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/coder-crypt0/dawwny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
dawwny-core = { path = "crates/core" }
dawwny-audio = { path = "crates/audio" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
debug = 1

