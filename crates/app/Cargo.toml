[package]
name = "dawwny-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dawwny"
path = "src/main.rs"

[dependencies]
dawwny-core.workspace = true
dawwny-audio.workspace = true
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
anyhow.workspace = true
serde_json.workspace = true
rfd = "0.15"

[features]
capture = ["eframe/__screenshot"]

[dev-dependencies]
tempfile = "3"
