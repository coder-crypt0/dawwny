[package]
name = "dawwny-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dawwny-core.workspace = true
dawwny-audio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
rmcp = { version = "3.3", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "io-std"] }

[dev-dependencies]
rmcp = { version = "3.3", default-features = false, features = ["client", "server", "macros", "transport-io"] }
tempfile = "3"
